# Meta-B run (E2-B = physical L63, E4-B = emulator): meta-train on train ICs, then FROZEN inference on `split`.
# All hyper-parameters are adjustable from the command line (pilot 2026-11-11); select them on val only.
variant: delta                # delta (1) | lookahead (2) | greedy (3) | supervised (4) | unroll (5 / 7: unroll.use_grad)
                              # | delta_exact (supervised delta: imitate the teacher update x^{k+1} - x^k)
seed: 42                      # dataset master seed
split: val                    # evaluation split: val (tuning) | test | test_ood   (never tune on test*)
pattern: full
constraint: strong            # strong | weak
dynamics: l63                 # l63 (E2-B) | emulator (E4-B)
emulator: xz095
emulator_dir: ${project_root:}/tmp/emulators
method: adagrad               # teacher: gd | adagrad | lbfgs | lbfgs_wolfe (lr = E1/E3-selected value for that configuration)
lr: 0.1
max_iter: 1000                # same budget / stopping rule as classical
tol: 1.0e-6
n_cases: null                 # evaluation cases (null = all)
checkpoint: null              # path to a saved learner -> skip training
diag_true_grad: true          # supervised only: G2 / gradient-fidelity diagnostics (not counted as cost)

train:
  n_train: null               # train ICs used for meta-training (null = all 1000)
  n_val_pairs_ic: 200         # supervised: val ICs whose teacher pairs select the best epoch

net:                          # delta variant: S_theta
  hidden: 64
  n_layers: 2
  emb_dim: 8
  output_scale: 5.0
  zero_init: true
  log_k: true

delta:                        # UNSUPERVISED delta. output free (default, 2026-11-18): module outputs Delta_hat, no teacher
                              # at inference, one meta step / iteration through the stored previous move (meta_b_free.py;
                              # net = `net` block hidden / n_layers / emb_dim / log_k; uses K, w_align, w_perf_delta,
                              # lambda_reg, meta_lr, grad_clip_norm, n_epochs, batch, episode_iters (0 = teacher mean
                              # iterations), train_seed, select_*). output stretch = original Meta-B (bice delta-mode defaults)
  output: free                # free | stretch
  obs_input: false            # free: append the case observations (values y, mask, times t/L) to the input
  arch: mlp                   # free: mlp (flat) | temporal (one token per obs time + 1D conv; needs obs_input)
  kernel: 5                   # free, temporal: Conv1d kernel along time
  select_stat: q90            # free: best-epoch val statistic of J(x^select_k): q90 (diverged = inf) | median
  pairs_cache: null           # free: teacher-run cache prefix (step-magnitude init l0, horizon when episode_iters 0)
  K: 20
  num_meta_steps: 10
  grad_align_steps: 6
  grad_trans_steps: 2
  w_align: 1.0
  w_align_perf: 0.0           # residual l_align weight in PERF (anti-saturation; 0 = bice)
  w_perf_delta: 2.5
  lambda_reg: 1.0e-4          # l_reg = lambda_reg * mean(theta^2)  (lambda^2 bug fixed)
  meta_lr: 1.0e-3
  grad_clip_norm: 1.0
  n_epochs: 1                 # passes over the train ICs
  batch: 100                  # cases per episode
  episode_iters: 100          # outer iterations per episode
  train_seed: 0
  select_epoch: false         # keep the best epoch by val score (median J after select_k frozen iterations)
  select_k: 10
  select_n_val: 100           # first n val ICs used for the epoch score
  hist_m: 0                   # free, ICE cell 2: > 0 = L-BFGS memory input of the learner's own moves (as delta_exact)
  base: grad                  # free + history: base direction grad (-g) | lbfgs (two-loop -H g of the own memory)
  first_step: learner         # free: learner | teacher (iteration 0 = one strong-Wolfe L-BFGS iteration, counted)
  safeguard: none             # free, INFERENCE: none | backtrack (reject + halve a move that did not decrease J)

supervised:
  hidden: 128
  n_layers: 3
  emb_dim: 8
  log_k: true
  lr: 1.0e-3
  weight_decay: 0.0
  epochs: 50
  batch_size: 1024
  seed: 0
  obs_input: false            # M5: append observations y + mask (cell 4 with case data)

lookahead:                    # M5 cell 2: Meta-B chain (net + delta.K) trained to the teacher iterate m steps ahead
  m: 5
  lr: 1.0e-3
  epochs: 30
  batch_size: 1024
  seed: 0

delta_exact:                  # SUPERVISED delta (2026-11-18): Delta_hat = -RMS(g) * u_theta(x, g_std, k), target = teacher update Delta
                              # u = exp(log-magnitude head) * normalised direction head, per block x0 | eta
  K: 1                        # inner rollout sub-steps of Delta_hat (1 = one direct prediction)
  hidden: 64
  n_layers: 2
  emb_dim: 8
  log_k: true
  obs_input: false            # append the case observations (values y, mask, times t/L) to the input
  arch: mlp                   # mlp (flat) | temporal (one token per obs time + 1D conv; needs obs_input)
  kernel: 5                   # temporal: Conv1d kernel along time
  coords: raw                 # raw (x climatology-standardised) | cvt (v0 = L^-1 (x0 - x0_b), B = L L^T; w = eta / sigma_q)
  grad_input: unit            # unit (g / RMS per case: magnitude dropped) | fixed (g / train-median RMS per block)
  obs_feat: y                 # y (case observations) | innov (innovations at the current iterate, from the same forward run)
  optimizer: adam             # adam (mini-batch, batch_size) | lbfgs (full batch, strong Wolfe, lbfgs_iters per epoch)
  lbfgs_iters: 20
  lbfgs_history: 50
  max_train_pairs: 0          # > 0: random subset of the train pairs
  hist_m: 0                   # > 0: history input = m most recent (s, y) pairs (L-BFGS memory), HistTemporalNet, no obs
  base: grad                  # history: base direction of the output law: grad (-g) | lbfgs (two-loop -H g, same memory)
  horizon: 1                  # target = teacher displacement over h steps x^{k+h} - x^k (delayed; capped at the end)
  safeguard: none             # INFERENCE: none | backtrack (reject + halve a move whose J did not decrease; no extra run)
  train_mode: offline         # offline (shuffled pairs) | online (teacher-run order, 1 Adam step / iteration, delayed target)
  online_cases: 100           # online: cases per episode
  train_loss: mean            # mean relative error | logmean: mean log(1 + rel)
  select: median              # best-epoch val statistic: median | logmean | mean
  first_step: learner         # learner | teacher (iteration 0 = one strong-Wolfe L-BFGS iteration, gradients counted)
  max_log_dev: 10.0           # |log-magnitude head| bound around the train-median teacher step
  lr: 1.0e-3
  epochs: 50
  batch_size: 1024
  grad_clip_norm: 1.0
  seed: 0
  pairs_cache: null           # path prefix -> <prefix>_{train,val}.pt (teacher pairs reused across seeds)

greedy:                       # M5 cell 3: free update without gradient, online greedy J(x^{k+1}) / J(x^k)
  obs_input: false
  step_scale: 0.1
  output_scale: 5.0
  hidden: 64
  n_layers: 2
  meta_lr: 1.0e-3
  num_meta_steps: 1
  n_epochs: 3
  batch: 100
  episode_iters: 100
  grad_clip: 1.0
  select_k: 10
  seed: 0
  n_val: 100

unroll:                       # learned optimization (M5 cells 5 = use_grad true / 7 = use_grad false)
  K: 20                       # fixed step budget (sweep {5, 10, 20, 50})
  use_grad: true
  second_order: false         # cell 5: keep d grad J / d theta (Hessian-vector products) in training
  obs_input: false            # no-gradient option: append observations y + mask to the input
  step_scale: 0.1             # Delta = step_scale * control climatological std * out, |out| <= output_scale
  output_scale: 5.0
  hidden: 64
  n_layers: 2
  lr: 1.0e-3
  epochs: 30
  batch: 100
  grad_clip: 1.0
  seed: 0
  n_val: 200                  # val ICs for best-epoch selection (mean J(x^K) / J(x^0); loss=sum: mean over m)
  loss: final                 # final: J(x^K)/J(x^0) | sum: mean_m J(x^m)/J(x^0) (speed-weighted, 2026-11-16)
  base: none                  # none | lbfgs (ICE cell 3: move = L-BFGS direction of its own moves + learned correction)
  safeguard: none             # none | backtrack (base lbfgs: reject + halve a move whose J did not decrease; no extra run)

learned_grad:                 # M5 cell 8: adjoint-free learned gradient (grad J_o from one forward run)
  surrogate_emulator: rho275  # supervision = this emulator's autodiff (grad J_o, or one-interval Jacobians)
  arch: adjoint               # adjoint (learned interval TL operators + exact adjoint recursion) | mlp (first version)
  data: sampled               # sampled (B-shaped controls around the first guess) | trajectory (hybrid-run states)
  loss: jacobian              # adjoint arch: jacobian (local, default) | gradient
  samples_per_case: 64
  perturb_scales: [0.5, 1.0, 2.0]
  traj_stride: 0               # sampled data: also every n-th hybrid-run state (0 = none: 45x cheaper collection)
  hidden: 128
  n_layers: 3
  emb_dim: 8
  log_k: true
  lr: 1.0e-3
  epochs: 50
  batch_size: 1024
  seed: 0
  n_val_ic: 200

# ---- D1 v2 (M5 blueprint; dataset=v2): model-error-isolated setting, see configs/fourdvar_v2.yaml -------------------
dataset: v1                   # v1 (D1) | v2 (D1 v2: lagged false-model first guess, hybrid B, false models)
data_prefix: l63v2            # v2 data file prefix: l63v2 (obs every 10 steps) | l63v2d (dense, every step)
model: f1                     # v2 estimation model: truth | f1 | emulator (uses `emulator`)
background: null              # v2 lagged background name (null = f1 for truth / f1, emulator name for emulator)
problem: bice                 # v2: bice | bpe
f1:
  sigma: 10.0
  rho: 27.5
  beta: 2.6666666666666665
bpe_prior_rel_std: 0.1

cost:
  window: 100
  obs_every: 10
  sigma_o2: 2.0
  sigma_b: 1.0
  sigma_q: 0.1
forecast: 500

data_dir: ${project_root:}/tmp/data
result_group: e2b             # e2b (M1) | e4b_<emulator>
out_dir: ${project_root:}/tmp/results/${result_group}
ckpt_dir: ${project_root:}/tmp/meta/${result_group}
tb_dir: ${project_root:}/tmp/tb/${result_group}
tag: ""                       # free suffix for sweeps
exp_name: ${variant}_${constraint}_${pattern}_${method}_lr${lr}${tag}

hydra:
  run:
    dir: ${project_root:}/tmp/hydra/meta_b/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${project_root:}/tmp/hydra/meta_b_sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
