# Meta-B run (E2-B = physical L63, E4-B = emulator): meta-train on train ICs, then FROZEN inference on `split`.
# All hyper-parameters are adjustable from the command line (pilot 2026-11-11); select them on val only.
variant: delta                # delta (bice delta chain, S(state, grad, emb(k)) stretches f) | supervised (G(state, emb(k)) -> grad)
seed: 42                      # dataset master seed
split: val                    # evaluation split: val (tuning) | test | test_ood   (never tune on test*)
pattern: full
constraint: strong            # strong | weak
dynamics: l63                 # l63 (E2-B) | emulator (E4-B)
emulator: xz095
emulator_dir: ${project_root:}/tmp/emulators
method: adagrad               # teacher: gd | adagrad (lr = E1/E3-selected value for that configuration)
lr: 0.1
max_iter: 1000                # same budget / stopping rule as classical
tol: 1.0e-6
n_cases: null                 # evaluation cases (null = all)
checkpoint: null              # path to a saved learner -> skip training
diag_true_grad: true          # supervised only: G2 / gradient-fidelity diagnostics (not counted as cost)

train:
  n_train: null               # train ICs used for meta-training (null = all 1000)
  n_val_pairs_ic: 200         # supervised: val ICs whose teacher pairs select the best epoch

net:                          # delta variant: S_theta
  hidden: 64
  n_layers: 2
  emb_dim: 8
  output_scale: 5.0
  zero_init: true
  log_k: true

delta:                        # bice delta-mode defaults
  K: 20
  num_meta_steps: 10
  grad_align_steps: 6
  grad_trans_steps: 2
  w_align: 1.0
  w_align_perf: 0.0           # residual l_align weight in PERF (anti-saturation; 0 = bice)
  w_perf_delta: 2.5
  lambda_reg: 1.0e-4          # l_reg = lambda_reg * mean(theta^2)  (lambda^2 bug fixed)
  meta_lr: 1.0e-3
  grad_clip_norm: 1.0
  n_epochs: 1                 # passes over the train ICs
  batch: 100                  # cases per episode
  episode_iters: 100          # outer iterations per episode
  train_seed: 0
  select_epoch: false         # keep the best epoch by val score (median J after select_k frozen iterations)
  select_k: 10
  select_n_val: 100           # first n val ICs used for the epoch score

supervised:
  hidden: 128
  n_layers: 3
  emb_dim: 8
  log_k: true
  lr: 1.0e-3
  weight_decay: 0.0
  epochs: 50
  batch_size: 1024
  seed: 0

cost:
  window: 100
  obs_every: 10
  sigma_o2: 2.0
  sigma_b: 1.0
  sigma_q: 0.1
forecast: 500

data_dir: ${project_root:}/tmp/data
result_group: e2b             # e2b (M1) | e4b_<emulator>
out_dir: ${project_root:}/tmp/results/${result_group}
ckpt_dir: ${project_root:}/tmp/meta/${result_group}
tb_dir: ${project_root:}/tmp/tb/${result_group}
tag: ""                       # free suffix for sweeps
exp_name: ${variant}_${constraint}_${pattern}_${method}_lr${lr}${tag}

hydra:
  run:
    dir: ${project_root:}/tmp/hydra/meta_b/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${project_root:}/tmp/hydra/meta_b_sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
