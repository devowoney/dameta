# Meta-B run (E2-B = physical L63, E4-B = emulator): meta-train on train ICs, then FROZEN inference on `split`.
# All hyper-parameters are adjustable from the command line (pilot 2026-11-11); select them on val only.
variant: delta                # delta (1) | lookahead (2) | greedy (3) | supervised (4) | unroll (5 / 7: unroll.use_grad)
seed: 42                      # dataset master seed
split: val                    # evaluation split: val (tuning) | test | test_ood   (never tune on test*)
pattern: full
constraint: strong            # strong | weak
dynamics: l63                 # l63 (E2-B) | emulator (E4-B)
emulator: xz095
emulator_dir: ${project_root:}/tmp/emulators
method: adagrad               # teacher: gd | adagrad (lr = E1/E3-selected value for that configuration)
lr: 0.1
max_iter: 1000                # same budget / stopping rule as classical
tol: 1.0e-6
n_cases: null                 # evaluation cases (null = all)
checkpoint: null              # path to a saved learner -> skip training
diag_true_grad: true          # supervised only: G2 / gradient-fidelity diagnostics (not counted as cost)

train:
  n_train: null               # train ICs used for meta-training (null = all 1000)
  n_val_pairs_ic: 200         # supervised: val ICs whose teacher pairs select the best epoch

net:                          # delta variant: S_theta
  hidden: 64
  n_layers: 2
  emb_dim: 8
  output_scale: 5.0
  zero_init: true
  log_k: true

delta:                        # bice delta-mode defaults
  K: 20
  num_meta_steps: 10
  grad_align_steps: 6
  grad_trans_steps: 2
  w_align: 1.0
  w_align_perf: 0.0           # residual l_align weight in PERF (anti-saturation; 0 = bice)
  w_perf_delta: 2.5
  lambda_reg: 1.0e-4          # l_reg = lambda_reg * mean(theta^2)  (lambda^2 bug fixed)
  meta_lr: 1.0e-3
  grad_clip_norm: 1.0
  n_epochs: 1                 # passes over the train ICs
  batch: 100                  # cases per episode
  episode_iters: 100          # outer iterations per episode
  train_seed: 0
  select_epoch: false         # keep the best epoch by val score (median J after select_k frozen iterations)
  select_k: 10
  select_n_val: 100           # first n val ICs used for the epoch score

supervised:
  hidden: 128
  n_layers: 3
  emb_dim: 8
  log_k: true
  lr: 1.0e-3
  weight_decay: 0.0
  epochs: 50
  batch_size: 1024
  seed: 0
  obs_input: false            # M5: append observations y + mask (cell 4 with case data)

lookahead:                    # M5 cell 2: Meta-B chain (net + delta.K) trained to the teacher iterate m steps ahead
  m: 5
  lr: 1.0e-3
  epochs: 30
  batch_size: 1024
  seed: 0

greedy:                       # M5 cell 3: free update without gradient, online greedy J(x^{k+1}) / J(x^k)
  obs_input: false
  step_scale: 0.1
  output_scale: 5.0
  hidden: 64
  n_layers: 2
  meta_lr: 1.0e-3
  num_meta_steps: 1
  n_epochs: 3
  batch: 100
  episode_iters: 100
  grad_clip: 1.0
  select_k: 10
  seed: 0
  n_val: 100

unroll:                       # learned optimization (M5 cells 5 = use_grad true / 7 = use_grad false)
  K: 20                       # fixed step budget (sweep {5, 10, 20, 50})
  use_grad: true
  second_order: false         # cell 5: keep d grad J / d theta (Hessian-vector products) in training
  obs_input: false            # no-gradient option: append observations y + mask to the input
  step_scale: 0.1             # Delta = step_scale * control climatological std * out, |out| <= output_scale
  output_scale: 5.0
  hidden: 64
  n_layers: 2
  lr: 1.0e-3
  epochs: 30
  batch: 100
  grad_clip: 1.0
  seed: 0
  n_val: 200                  # val ICs for best-epoch selection (mean J(x^K) / J(x^0))

learned_grad:                 # M5 cell 8: adjoint-free learned gradient (grad J_o from one forward run)
  surrogate_emulator: rho275  # supervision = this emulator's autodiff (grad J_o, or one-interval Jacobians)
  arch: adjoint               # adjoint (learned interval TL operators + exact adjoint recursion) | mlp (first version)
  data: sampled               # sampled (B-shaped controls around the first guess) | trajectory (hybrid-run states)
  loss: jacobian              # adjoint arch: jacobian (local, default) | gradient
  samples_per_case: 64
  perturb_scales: [0.5, 1.0, 2.0]
  traj_stride: 0               # sampled data: also every n-th hybrid-run state (0 = none: 45x cheaper collection)
  hidden: 128
  n_layers: 3
  emb_dim: 8
  log_k: true
  lr: 1.0e-3
  epochs: 50
  batch_size: 1024
  seed: 0
  n_val_ic: 200

# ---- D1 v2 (M5 blueprint; dataset=v2): model-error-isolated setting, see configs/fourdvar_v2.yaml -------------------
dataset: v1                   # v1 (D1) | v2 (D1 v2: lagged false-model first guess, hybrid B, false models)
model: f1                     # v2 estimation model: truth | f1 | emulator (uses `emulator`)
background: null              # v2 lagged background name (null = f1 for truth / f1, emulator name for emulator)
problem: bice                 # v2: bice | bpe
f1:
  sigma: 10.0
  rho: 27.5
  beta: 2.6666666666666665
bpe_prior_rel_std: 0.1

cost:
  window: 100
  obs_every: 10
  sigma_o2: 2.0
  sigma_b: 1.0
  sigma_q: 0.1
forecast: 500

data_dir: ${project_root:}/tmp/data
result_group: e2b             # e2b (M1) | e4b_<emulator>
out_dir: ${project_root:}/tmp/results/${result_group}
ckpt_dir: ${project_root:}/tmp/meta/${result_group}
tb_dir: ${project_root:}/tmp/tb/${result_group}
tag: ""                       # free suffix for sweeps
exp_name: ${variant}_${constraint}_${pattern}_${method}_lr${lr}${tag}

hydra:
  run:
    dir: ${project_root:}/tmp/hydra/meta_b/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${project_root:}/tmp/hydra/meta_b_sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
