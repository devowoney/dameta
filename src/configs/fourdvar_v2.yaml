# Classical 4D-Var on D1 v2 (M5 blueprint: model-error-isolated BICE / BPE; memory/branches/m5-meta-grid/blueprint.md)
seed: 42
data_prefix: l63v2           # l63v2 (obs every 10 steps) | l63v2d (dense: obs every step, src/make_dense_obs.py)
split: val                    # val (lr tuning) | test | test_ood   (never tune on test*)
pattern: full                 # full | x_only
constraint: strong            # strong | weak   (bpe: strong only)
problem: bice                 # bice (initial condition) | bpe (joint [x0, sigma, rho, beta]; model f1 only)
model: f1                     # estimation model (src/configs/models.yaml): l1 (alias truth) | f1 | f2 | e1 | e2
                              # | emulator (legacy v2 path, file `emulator`)
emulator: rho275              # used only when model = emulator (legacy)
background: null              # lagged-ensemble background name; null = the model's own (l1: `l1_background`)
background_cov: static        # static = one truth-free 3x3 B per model (tmp/data/static_B_seed<S>.json, src/estimate_b.py;
                              # pilot 2026-11-26) | hybrid = flow-dependent alpha B_ens + (1 - alpha) s2 I (earlier runs)
l1_background: f1             # first guess / B used by the L1 perfect-model reference (same as F1, v2 convention)
registry_overrides: {}        # top-level overrides of models.yaml, e.g. {eps1: 0.01, eps2: 0.05}
method: adagrad               # gd | adagrad | adam | lbfgs_wolfe (strong-Wolfe L-BFGS reference, lr = 1)
lr: 0.1
gradient: exact               # exact (adjoint) | fd (central FD, forward only) | hybrid (J: L63 model, grad: emulator adjoint)
fd_eps: 1.0e-6
surrogate_emulator: e1        # gradient source for gradient=hybrid (emulator file name)
max_iter: 1000
tol: 1.0e-6
n_cases: null
g1_iter: false                # ICE table: record per-iterate G1 (cos with the true-model gradient), reporting only
landscape_iter: false         # M8: cos_truth + Hessian spectrum per iterate and at the analysis (reporting only)
hess_every: 1                 # M8: Hessian every n iterations (1 = every iterate)

bpe_prior_rel_std: 0.1        # parameter prior std = 10 % of each prior value

cost:                         # window / obs geometry are read from the D1 v2 file; B = hybrid (tmp/data/hybrid_B_*.json)
  sigma_o2: null              # null = the data's sigma_o2 (D1 v2 attrs; 4.0 since 2026-11-25, was 2.0)
  b_infl: 4.0                 # weaker background (pilot 2026-11-25): B = b_infl * B_hybrid in J_b (1 = tuned hybrid)
  sigma_q: 0.1
  q: model                    # model = per-model diagonal Q (tmp/data/model_q_seed<S>.json, src/estimate_q.py; pilot
                              # 2026-11-26: sigma_q 0.1 was 4-30x below the model error, weak == strong); null = sigma_q^2 I
forecast: 500

data_dir: ${project_root:}/tmp/data
emulator_dir: ${project_root:}/tmp/emulators
result_group: v2_${model}${bpe_suffix:${problem}}${grad_suffix:${gradient}}
out_dir: ${project_root:}/tmp/results/${result_group}
exp_name: ${problem}_${constraint}_${pattern}_${method}_lr${lr}_${split}

hydra:
  run:
    dir: ${project_root:}/tmp/hydra/fourdvar_v2/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${project_root:}/tmp/hydra/fourdvar_v2_sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
