# D1 data generation — DA configuration v0 (approved 2026-11-10, see memory/original.md)
seed: 42                       # master seed; splits get independent streams via numpy SeedSequence.spawn

l63:
  sigma: 10.0
  rho: 28.0
  beta: 2.6666666666666665     # 8/3
  dt: 0.01

data:
  window: 100                  # L (steps)
  forecast: 500                # F (steps beyond window)
  obs_every: 10                # obs at t = 0, 10, ..., 100
  sigma_o2: 2.0                # R = sigma_o2 * I
  sigma_b: 1.0                 # B = sigma_b^2 * I
  spinup: 1000
  ic_init_std: 10.0

n_ic:                          # number of initial conditions per split (split by IC; test never used in training)
  train: 1000
  val: 200
  test: 200

out_dir: ${project_root:}/tmp/data   # all outputs stay in tmp/ until the pilot authorizes run/

hydra:
  run:
    dir: ${project_root:}/tmp/hydra/gen_data/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
